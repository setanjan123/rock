name: Go Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        run: go test -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
          - name: windows-amd64
            goos: windows
            goarch: amd64
          - name: macos-arm64
            goos: darwin
            goarch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build executable and archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TARGET_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail

          mkdir -p dist
          binary_name="rock-${TARGET_NAME}"
          if [ "$GOOS" = "windows" ]; then
            binary_name="${binary_name}.exe"
          fi

          GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o "dist/${binary_name}" .

          if [ "$GOOS" = "windows" ]; then
            (cd dist && 7z a "${binary_name%.exe}.zip" "$binary_name")
          else
            tar -czf "dist/${binary_name}.tar.gz" -C dist "$binary_name"
          fi

      - name: Upload build assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Rock (rolling)
          body: Latest build from the main branch. Updated automatically.
          make_latest: true
          files: dist/*
